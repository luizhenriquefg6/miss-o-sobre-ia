<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 LUNAR AI · HACK THE FUTURE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET E BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background: #0a0b1a;
            color: #00ffc8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 200, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(108, 92, 231, 0.05) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300ffc8' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        /* ===== EFEITO DE SCAN ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, 
                transparent 0px, 
                transparent 3px, 
                rgba(0, 255, 200, 0.01) 3px, 
                rgba(0, 255, 200, 0.01) 4px
            );
            pointer-events: none;
            z-index: 999;
        }

        /* ===== APP CONTAINER ===== */
        #app {
            max-width: 1200px;
            width: 100%;
            background: rgba(10, 11, 26, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid rgba(0, 255, 200, 0.15);
            box-shadow: 
                0 0 60px rgba(0, 255, 200, 0.05),
                inset 0 0 60px rgba(0, 255, 200, 0.02);
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid rgba(0, 255, 200, 0.1);
            padding-bottom: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .logo .icon {
            font-size: 2.2rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(0, 255, 200, 0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }

        .logo h1 {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffc8, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 200, 0.1);
        }

        .logo h1 span {
            -webkit-text-fill-color: #6c5ce7;
            font-weight: 400;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: #00ffc8;
            opacity: 0.7;
        }

        .status-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffc8;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .status-item .dot.off {
            background: #ff4444;
            animation: none;
        }

        #themeToggle {
            background: rgba(0, 255, 200, 0.05);
            border: 1px solid rgba(0, 255, 200, 0.15);
            color: #00ffc8;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        #themeToggle:hover {
            background: rgba(0, 255, 200, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.1);
        }

        /* ===== TERMINAL HEADER ===== */
        .terminal-header {
            background: rgba(0, 255, 200, 0.03);
            border: 1px solid rgba(0, 255, 200, 0.05);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85rem;
            color: #00ffc8;
            opacity: 0.8;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .terminal-header .prompt {
            color: #6c5ce7;
        }

        .terminal-header .blink {
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(0, 255, 200, 0.05);
            padding-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .tab {
            background: transparent;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 2rem;
            color: rgba(0, 255, 200, 0.4);
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .tab:hover {
            color: #00ffc8;
            background: rgba(0, 255, 200, 0.05);
        }

        .tab.active {
            color: #00ffc8;
            background: rgba(0, 255, 200, 0.08);
            border: 1px solid rgba(0, 255, 200, 0.15);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.05);
        }

        /* ===== TAB PANELS ===== */
        .tab-panel {
            display: none;
            animation: fadeSlide 0.5s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== CONCEITOS ===== */
        .conceitos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .conceito-card {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.08);
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.4s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .conceito-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 255, 200, 0.03), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .conceito-card:hover::before {
            opacity: 1;
        }

        .conceito-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 255, 200, 0.2);
            box-shadow: 0 10px 40px rgba(0, 255, 200, 0.05);
        }

        .conceito-card .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 10px rgba(0, 255, 200, 0.1));
        }

        .conceito-card h4 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            margin-bottom: 0.3rem;
            color: #00ffc8;
        }

        .conceito-card p {
            color: rgba(0, 255, 200, 0.6);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .conceito-card .exemplo {
            margin-top: 0.8rem;
            font-size: 0.75rem;
            color: #6c5ce7;
            background: rgba(108, 92, 231, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 2rem;
            display: inline-block;
            border: 1px solid rgba(108, 92, 231, 0.1);
        }

        /* ===== SIMULADOR ===== */
        .simulator-container h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #00ffc8;
        }

        .simulator-container .subtitle {
            color: rgba(0, 255, 200, 0.5);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .pattern-game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            max-width: 320px;
            width: 100%;
        }

        .pattern-cell {
            aspect-ratio: 1;
            background: rgba(0, 255, 200, 0.03);
            border: 2px solid rgba(0, 255, 200, 0.08);
            border-radius: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .pattern-cell.active {
            background: #00ffc8;
            border-color: #00ffc8;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
        }

        .pattern-cell:hover {
            transform: scale(1.05);
            border-color: rgba(0, 255, 200, 0.2);
        }

        .pattern-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pattern-feedback {
            min-height: 2.5rem;
            font-weight: 400;
            text-align: center;
            color: rgba(0, 255, 200, 0.8);
            padding: 0.5rem 1rem;
            border: 1px solid rgba(0, 255, 200, 0.05);
            border-radius: 1rem;
            background: rgba(0, 255, 200, 0.02);
            width: 100%;
            max-width: 400px;
        }

        /* ===== QUIZ ===== */
        .quiz-container {
            max-width: 650px;
            margin: 0 auto;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .quiz-header h3 {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #00ffc8;
        }

        .quiz-score {
            background: rgba(0, 255, 200, 0.05);
            padding: 0.3rem 1.2rem;
            border-radius: 2rem;
            font-weight: 400;
            color: #00ffc8;
            border: 1px solid rgba(0, 255, 200, 0.1);
        }

        .quiz-question {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            min-height: 3rem;
            color: #00ffc8;
            padding: 1rem;
            background: rgba(0, 255, 200, 0.02);
            border-radius: 1rem;
            border-left: 3px solid #00ffc8;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .quiz-option {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.06);
            border-radius: 1rem;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            color: rgba(0, 255, 200, 0.8);
            font-size: 0.95rem;
            text-align: left;
            font-family: 'Share Tech Mono', monospace;
        }

        .quiz-option:hover:not(.disabled) {
            background: rgba(0, 255, 200, 0.05);
            border-color: rgba(0, 255, 200, 0.15);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: rgba(0, 255, 200, 0.1);
            border-color: #00ffc8;
            color: #00ffc8;
        }

        .quiz-option.wrong {
            background: rgba(255, 68, 68, 0.1);
            border-color: #ff4444;
            color: #ff4444;
        }

        .quiz-option.disabled {
            cursor: default;
            opacity: 0.5;
        }

        /* ===== LINHA DO TEMPO ===== */
        .timeline-container {
            position: relative;
            padding: 2rem 0;
        }

        .timeline-item {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid rgba(0, 255, 200, 0.1);
        }

        .timeline-item:last-child {
            border-left: none;
        }

        .timeline-year {
            min-width: 80px;
            font-weight: 700;
            color: #00ffc8;
            font-size: 1.2rem;
            font-family: 'Orbitron', monospace;
        }

        .timeline-content {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.05);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            flex: 1;
        }

        .timeline-content h4 {
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            color: #00ffc8;
            margin-bottom: 0.3rem;
        }

        .timeline-content p {
            color: rgba(0, 255, 200, 0.5);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ===== GERADOR DE SENHAS ===== */
        .password-display {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.08);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .password-wrapper {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            background: rgba(0, 255, 200, 0.03);
            border-radius: 1rem;
            padding: 0.3rem;
            border: 1px solid rgba(0, 255, 200, 0.05);
            transition: border-color 0.3s;
        }

        .password-wrapper:focus-within {
            border-color: rgba(0, 255, 200, 0.2);
        }

        .password-field {
            flex: 1;
            border: none;
            padding: 0.8rem 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            font-weight: 400;
            background: transparent;
            outline: none;
            color: #00ffc8;
            letter-spacing: 1px;
        }

        .btn-copy {
            background: rgba(0, 255, 200, 0.05);
            color: #00ffc8;
            border: 1px solid rgba(0, 255, 200, 0.05);
            padding: 0.6rem 1rem;
            border-radius: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-copy:hover {
            background: rgba(0, 255, 200, 0.1);
            border-color: rgba(0, 255, 200, 0.15);
            transform: scale(1.05);
        }

        .strength-indicator {
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .strength-text {
            font-size: 0.8rem;
            color: rgba(0, 255, 200, 0.5);
            min-width: 70px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 255, 200, 0.05);
            transition: all 0.4s ease;
        }

        .strength-bar.weak {
            background: #ff4444;
            width: 25%;
        }
        .strength-bar.medium {
            background: #ffaa00;
            width: 50%;
        }
        .strength-bar.strong {
            background: #00ffc8;
            width: 75%;
        }
        .strength-bar.very-strong {
            background: #6c5ce7;
            width: 100%;
        }

        .controls {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.05);
            border-radius: 1.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .control-group label {
            font-weight: 400;
            font-size: 0.9rem;
            color: rgba(0, 255, 200, 0.7);
        }

        .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 255, 200, 0.05);
            outline: none;
            transition: background 0.3s;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00ffc8;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(0, 255, 200, 0.1);
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.8rem;
            transition: background 0.2s;
        }

        .option-item:hover {
            background: rgba(0, 255, 200, 0.03);
        }

        .option-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #00ffc8;
            cursor: pointer;
        }

        .option-item span {
            font-size: 0.85rem;
            color: rgba(0, 255, 200, 0.7);
        }

        .action-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            flex: 1;
            background: rgba(0, 255, 200, 0.05);
            color: #00ffc8;
            border: 1px solid rgba(0, 255, 200, 0.1);
            padding: 0.8rem 1.8rem;
            border-radius: 1.2rem;
            font-weight: 400;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-family: 'Share Tech Mono', monospace;
            min-width: 120px;
        }

        .btn-primary:hover {
            background: rgba(0, 255, 200, 0.1);
            border-color: rgba(0, 255, 200, 0.2);
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.05);
        }

        .btn-secondary {
            background: rgba(0, 255, 200, 0.02);
            color: rgba(0, 255, 200, 0.5);
            border: 1px solid rgba(0, 255, 200, 0.05);
            padding: 0.8rem 1.8rem;
            border-radius: 1.2rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Share Tech Mono', monospace;
            min-width: 100px;
        }

        .btn-secondary:hover {
            background: rgba(0, 255, 200, 0.05);
            border-color: rgba(0, 255, 200, 0.1);
            transform: scale(1.02);
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .chip {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.05);
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            font-size: 0.8rem;
            color: rgba(0, 255, 200, 0.5);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Share Tech Mono', monospace;
        }

        .chip:hover {
            background: rgba(0, 255, 200, 0.05);
            border-color: rgba(0, 255, 200, 0.1);
            color: #00ffc8;
            transform: translateY(-2px);
        }

        .history-area {
            background: rgba(0, 255, 200, 0.02);
            border: 1px solid rgba(0, 255, 200, 0.05);
            border-radius: 1.5rem;
            padding: 1.5rem;
            margin-top: 1.5rem;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-header h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            color: rgba(0, 255, 200, 0.7);
        }

        .btn-text {
            background: none;
            border: none;
            color: rgba(0, 255, 200, 0.3);
            font-size: 0.8rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.3rem 0.6rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .btn-text:hover {
            color: #ff4444;
        }

        .history-container {
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(0, 255, 200, 0.2);
            padding: 1.5rem 0;
            font-size: 0.85rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 255, 200, 0.02);
            border-radius: 0.8rem;
            border-left: 2px solid #00ffc8;
            animation: fadeSlide 0.3s ease;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .history-item .password {
            font-family: 'Share Tech Mono', monospace;
            font-weight: 400;
            font-size: 0.85rem;
            color: #00ffc8;
        }

        .history-item .date {
            font-size: 0.7rem;
            color: rgba(0, 255, 200, 0.3);
        }

        .history-item .btn-copy-small {
            background: none;
            border: none;
            color: rgba(0, 255, 200, 0.3);
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
            transition: color 0.2s;
